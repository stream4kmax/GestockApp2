name: gestock_pos
description: "GHA Stock DZ (Gestion · Hassani · Android) — stock et point de vente, hors ligne."
publish_to: 'none'

# version: <nom de version>+<numéro de build Android (versionCode)>
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:          # Traductions Material (dates, boutons…) en français / arabe
    sdk: flutter

  # --- Étape 1 : base locale + état + formatage ---
  sqflite: ^2.3.3                 # Base SQLite embarquée (fonctionne 100 % hors ligne)
  path: ^1.9.0                    # Construction du chemin du fichier .db
  provider: ^6.1.2                # Gestion d'état simple (panier, etc.)
  intl: any                       # Formatage monétaire / dates (version imposée par flutter_localizations)
  uuid: ^4.4.0                    # Identifiants uniques (indispensables pour la synchro multi-appareils)

  # --- Étape 2 : messagerie / Étape 3 : PDF (décommenter à l'étape 3) ---
  # pdf: ^3.11.0
  # printing: ^5.13.0
  url_launcher: ^6.3.0            # v2 : ouverture de WhatsApp / SMS / appel
  # share_plus: ^10.0.0
  # path_provider: ^2.1.4

  # --- Étape 5 : synchronisation cloud (décommenter après configuration Firebase) ---
  # firebase_core: ^3.6.0
  # firebase_auth: ^5.3.0
  # cloud_firestore: ^5.4.0
  # connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1   # v2c : génère l'icône GHA de l'application

flutter:
  uses-material-design: true
  assets:
    - assets/logo/            # logo GHA Stock DZ (affiché sur l'accueil)

# -----------------------------------------------------------------------------
# Icône de l'application (commande : dart run flutter_launcher_icons)
# Le workflow GitHub l'exécute automatiquement avant la compilation.
# -----------------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/gha_icone.png"                       # anciens Android
  adaptive_icon_background: "#F4F6FA"                           # Android 8+ : fond
  adaptive_icon_foreground: "assets/logo/gha_icone_foreground.png" # Android 8+ : dessin
  min_sdk_android: 21
